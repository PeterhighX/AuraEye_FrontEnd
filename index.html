<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>0-1 负一屏</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen" data-node-id="20:1632">
    <!-- Background -->
    <div class="background-full" aria-hidden="true">
      <div class="background-blur">
        <img class="bg-gradient" src="assets/bg-gradient.png" alt="" />
      </div>
      <div class="background-masks">
        <div class="mask-layer mask-top"></div>
        <div class="mask-layer mask-bottom"></div>
        <div class="mask-layer mask-middle"></div>
      </div>
    </div>

    <!-- Floating CTA -->
    <div class="daily-cta" data-node-id="20:1655">
      <img class="daily-cta-icon" src="assets/icon-tip.png" alt="" />
      <span>快来使用每日一拍吧</span>
    </div>

    <!-- Main content -->
    <div class="main-content" data-node-id="20:1658">
      <!-- Header -->
      <header class="header" data-node-id="20:1659">
        <img class="header-avatar" src="assets/avatar-user.png" alt="Mrs.Zhang" />
        <p class="header-name">Mrs.Zhang</p>
        <img class="status-dot" src="assets/status-dot.png" alt="" />
        <p class="header-status">开心</p>
        <div class="header-credits" data-node-id="20:1671">
          <img src="assets/icon-sparkle.png" alt="" />
          <span>50</span>
        </div>
        <button class="header-icon-btn header-icon-menu" aria-label="菜单">
          <img src="assets/icon-menu2.png" alt="" />
        </button>
        <button class="header-icon-btn header-icon-more" aria-label="更多">
          <img src="assets/icon-menu1.png" alt="" />
        </button>
      </header>

      <!-- Tip bar -->
      <div class="tip-bar" data-node-id="20:1675">
        <span class="tip-tag">小知识</span>
        <p class="tip-text">毛刷的作用可以柔化边缘，但是要定时清理哦！</p>
      </div>

      <!-- Chat area -->
      <div class="chat-area" data-node-id="20:1680">
        <div class="chat-list">
          <!-- AI message 1 -->
          <div class="message-row message-left" data-node-id="20:1682">
            <img class="msg-avatar" src="assets/avatar-ai.png" alt="" />
            <div class="bubble bubble-ai">
              <p><strong>Mrs Zhang</strong>，请给我一张图片帮你生成今日的妆容</p>
            </div>
            <img class="msg-avatar msg-avatar-placeholder" src="assets/avatar-placeholder.png" alt="" aria-hidden="true" />
          </div>

          <!-- User message -->
          <div class="message-row message-right" data-node-id="20:1683">
            <img class="msg-avatar msg-avatar-placeholder" src="assets/avatar-placeholder.png" alt="" aria-hidden="true" />
            <div class="bubble bubble-user">
              <p>这是我的图片，我想看到在公园玩耍的样子</p>
              <img class="msg-photo" src="assets/park-photo.png" alt="公园照片" />
            </div>
            <img class="msg-avatar" src="assets/avatar-user-msg.png" alt="" />
          </div>

          <!-- AI message 2 -->
          <div class="message-group" data-node-id="20:1689">
            <div class="message-row message-left" data-node-id="20:1690">
              <img class="msg-avatar" src="assets/avatar-ai.png" alt="" />
              <div class="bubble bubble-ai">
                <p>看到你的美照啦！公园的阳光和绿树真的特别有朝气呢，今天的天气也刚好非常适合出门走走，这就给你推荐妆容哈</p>
              </div>
            </div>

            <!-- AI generating -->
            <div class="message-row message-left" data-node-id="20:1694">
              <img class="msg-avatar" src="assets/avatar-ai2.png" alt="" />
              <div class="bubble bubble-ai bubble-generating">
                <p>✨ 灵感生成提示：专属的妆容效果已经快马加鞭在生成中啦，</p>
                <div class="generating-placeholder"></div>
              </div>
              <img class="msg-avatar msg-avatar-placeholder" src="assets/avatar-placeholder.png" alt="" aria-hidden="true" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Suggestion chips -->
    <div class="suggestion-chips" data-node-id="20:1714">
      <button class="chip">
        <img src="assets/icon-fresh.png" alt="" />
        <span>我想要更清新</span>
      </button>
      <button class="chip">
        <img src="assets/icon-formal.png" alt="" />
        <span>我想要正式一点</span>
      </button>
    </div>

    <!-- Bottom input bar -->
    <footer class="input-bar" data-node-id="20:1700">
      <button class="input-icon-btn" aria-label="添加">
        <img src="assets/icon-plus.png" alt="" />
      </button>
      <button class="input-icon-btn" aria-label="拍照">
        <img src="assets/icon-camera.png" alt="" />
      </button>
      <div class="input-field">
        <span class="input-placeholder">来探寻今日的妆容灵感</span>
      </div>
      <button class="input-icon-btn" aria-label="上传">
        <img src="assets/icon-upload.png" alt="" />
      </button>
    </footer>
  </div>
</body>
</html>
