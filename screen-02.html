<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=402, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>0-2 负一屏</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen screen--02" data-node-id="20:1724">
    <!-- Background -->
    <div class="background-full" aria-hidden="true">
      <div class="background-blur">
        <img class="bg-gradient" src="assets/bg-gradient.png" alt="" />
      </div>
    </div>

    <!-- Header + tip -->
    <div class="top-section" data-node-id="20:1751">
      <header class="header" data-node-id="20:1752">
        <img class="header-avatar" src="assets/avatar-user.png" alt="Mrs.Zhang" />
        <p class="header-name">Mrs.Zhang</p>
        <img class="status-dot" src="assets/status-dot.png" alt="" />
        <p class="header-status">开心</p>
        <div class="header-credits" data-node-id="20:1764">
          <img src="assets/icon-sparkle.png" alt="" />
          <span>50</span>
        </div>
        <button class="header-icon-btn header-icon-menu" aria-label="菜单">
          <img src="assets/icon-menu2.png" alt="" />
        </button>
        <button class="header-icon-btn header-icon-more" aria-label="更多">
          <img src="assets/icon-menu1.png" alt="" />
        </button>
      </header>

      <div class="tip-bar" data-node-id="20:1768">
        <span class="tip-tag">小知识</span>
        <p class="tip-text">毛刷的作用可以柔化边缘，但是要定时清理哦！</p>
      </div>
    </div>

    <!-- Compact chat (keyboard open) -->
    <div class="chat-area chat-area--compact" data-node-id="20:1742">
      <div class="chat-list">
        <div class="message-row message-left" data-node-id="20:1743">
          <img class="msg-avatar" src="assets/avatar-ai.png" alt="" />
          <div class="bubble bubble-ai">
            <p><strong>Mrs Zhang</strong>，请给我一张图片帮你生成今日的妆容</p>
          </div>
          <img class="msg-avatar msg-avatar-placeholder" src="assets/avatar-placeholder.png" alt="" aria-hidden="true" />
        </div>

        <div class="message-row message-right" data-node-id="20:1744">
          <img class="msg-avatar msg-avatar-placeholder" src="assets/avatar-placeholder.png" alt="" aria-hidden="true" />
          <div class="bubble bubble-user">
            <p>铛铛！这是我的图片</p>
            <img class="msg-photo" src="assets/park-photo-v2.png" alt="公园照片" />
          </div>
          <img class="msg-avatar" src="assets/avatar-user-msg.png" alt="" />
        </div>

        <div class="message-row message-left" data-node-id="20:1750">
          <img class="msg-avatar" src="assets/avatar-ai2.png" alt="" />
          <div class="bubble bubble-ai">
            <p>好的！这就结合您今日的天气给您推荐合适的妆容！！</p>
          </div>
          <img class="msg-avatar msg-avatar-placeholder" src="assets/avatar-placeholder.png" alt="" aria-hidden="true" />
        </div>
      </div>
    </div>

    <!-- Input bar (above keyboard) -->
    <footer class="input-bar input-bar--keyboard" data-node-id="20:1773">
      <button class="input-icon-btn" aria-label="添加">
        <img src="assets/icon-plus.png" alt="" />
      </button>
      <button class="input-icon-btn" aria-label="拍照">
        <img src="assets/icon-camera.png" alt="" />
      </button>
      <div class="input-field">
        <span class="input-placeholder">来探寻今日的妆容灵感</span>
      </div>
      <button class="input-icon-btn" aria-label="上传">
        <img src="assets/icon-upload.png" alt="" />
      </button>
    </footer>

    <!-- iOS keyboard -->
    <div class="ios-keyboard" data-node-id="20:1787" role="group" aria-label="键盘">
      <div class="keyboard-row">
        <button class="key" type="button">q</button>
        <button class="key" type="button">w</button>
        <button class="key" type="button">e</button>
        <button class="key" type="button">r</button>
        <button class="key" type="button">t</button>
        <button class="key" type="button">y</button>
        <button class="key" type="button">u</button>
        <button class="key" type="button">i</button>
        <button class="key" type="button">o</button>
        <button class="key" type="button">p</button>
      </div>
      <div class="keyboard-row keyboard-row--indent">
        <button class="key" type="button">a</button>
        <button class="key" type="button">s</button>
        <button class="key" type="button">d</button>
        <button class="key" type="button">f</button>
        <button class="key" type="button">g</button>
        <button class="key" type="button">h</button>
        <button class="key" type="button">j</button>
        <button class="key" type="button">k</button>
        <button class="key" type="button">l</button>
      </div>
      <div class="keyboard-row">
        <button class="key key--wide" type="button" aria-label="Shift">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 2L2 9h10L7 2z" fill="currentColor"/>
          </svg>
        </button>
        <button class="key" type="button">z</button>
        <button class="key" type="button">x</button>
        <button class="key" type="button">c</button>
        <button class="key" type="button">v</button>
        <button class="key" type="button">b</button>
        <button class="key" type="button">n</button>
        <button class="key" type="button">m</button>
        <button class="key key--wide" type="button" aria-label="Delete">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none" aria-hidden="true">
            <path d="M6 1H17v10H6L1 6l5-5z" stroke="currentColor" stroke-width="1.2" fill="none"/>
            <path d="M12 4l-3 3 3 3" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
      </div>
      <div class="keyboard-row">
        <button class="key key--func" type="button">ABC</button>
        <button class="key key--space" type="button" aria-label="空格">&nbsp;</button>
        <button class="key key--return" type="button" aria-label="回车">
          <svg width="16" height="14" viewBox="0 0 16 14" fill="none" aria-hidden="true">
            <path d="M2 4h8v-3l5 5-5 5V8H2V4z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="keyboard-toolbar">
        <button class="keyboard-toolbar-btn" type="button" aria-label="表情">😊</button>
        <button class="keyboard-toolbar-btn" type="button" aria-label="语音">🎤</button>
      </div>
    </div>
  </div>
</body>
</html>
